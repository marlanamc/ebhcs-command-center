<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EBHCS Command Center</title>
  <meta name="description" content="One place for Drive folders, your teaching sites, pins, and your list." />
  <meta name="theme-color" content="#184952" />
  <link rel="icon" href="icons/app/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/app/icon-512.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EBHCS" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />

  <style>
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; overflow-x:clip; overscroll-behavior-x:none; }
    :root {
      --page-top-gutter: max(20px, env(safe-area-inset-top, 0px));
      --header-top-pad: max(28px, calc(env(safe-area-inset-top, 0px) + 14px));
    }
    body {
      margin:0; width:100%; max-width:100%; overflow-x:clip; overscroll-behavior-x:none;
      touch-action:pan-y pinch-zoom;
      font-family:var(--sans); color:var(--ink); line-height:1.5;
      background:var(--canvas-bg);
      -webkit-font-smoothing:antialiased;
      padding:var(--page-top-gutter) var(--layout-gutter) calc(40px + env(safe-area-inset-bottom));
      min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:stretch;
    }
    .wrap {
      width:100%; max-width:min(var(--layout-max),100%); margin-inline:auto; min-width:0;
      flex:1 0 auto; display:flex; flex-direction:column;
    }
    a { color:inherit; }
    .skip-link {
      position:absolute; left:16px; top:-100%; z-index:100; padding:10px 14px;
      border-radius:var(--radius); background:var(--card); color:var(--ink);
      font-weight:650; border:1px solid var(--line); box-shadow:var(--shadow);
      text-decoration:none;
    }
    .skip-link:focus { position:fixed; top:max(16px,env(safe-area-inset-top)); left:16px; outline:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* ---- header ------------------------------------------------------ */
    header.hero {
      margin-inline:calc(50% - 50vw);
      margin-top:calc(-1 * var(--page-top-gutter));
      margin-bottom:26px;
      padding-top:var(--header-top-pad);
      padding-inline:var(--layout-gutter);
      background:var(--hero-bg);
      border-bottom:1px solid var(--line);
      position:relative;
      overflow:hidden;
    }
    /* Faint chart grid — navigational paper, not decoration for its own sake */
    header.hero::before {
      content:"";
      position:absolute; inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(var(--chart-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--chart-grid) 1px, transparent 1px);
      background-size:28px 28px;
      mask-image:linear-gradient(to bottom, #000 0%, transparent 78%);
      opacity:.85;
    }
    .hero-inner {
      display:flex; align-items:center; flex-wrap:wrap; gap:4px 12px;
      max-width:min(var(--layout-max),100%); margin-inline:auto; padding:18px 0 16px;
      min-width:0; position:relative; z-index:1;
    }
    .brand-mark {
      flex:none; width:34px; height:34px; border-radius:50%;
      display:grid; place-items:center;
      background:color-mix(in srgb, var(--brand) 16%, var(--card));
      color:var(--brand-deep);
      border:1px solid color-mix(in srgb, var(--brand) 30%, var(--line));
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--card) 70%, transparent),
        0 0 0 2px color-mix(in srgb, var(--earth) 28%, transparent);
    }
    .brand-mark svg { width:18px; height:18px; }
    h1 {
      font-family:var(--display); font-weight:700; font-size:clamp(21px,2.7vw,27px);
      line-height:1.08; letter-spacing:-0.01em; color:var(--ink); margin:0;
    }
    .head-meta {
      display:flex; flex-direction:column; align-items:flex-end; gap:2px;
      min-width:0; margin-left:auto; flex:none; text-align:right;
    }
    .greeting {
      font-size:11px; font-weight:650; line-height:1.3; letter-spacing:.12em;
      text-transform:uppercase; color:var(--eyebrow-deep);
    }
    .head-right { display:flex; align-items:center; gap:8px; flex:none; }
    .icon-btn {
      width:44px; height:44px; display:grid; place-items:center; background:var(--card);
      border:1px solid var(--line); border-radius:999px; color:var(--ink); cursor:pointer;
      box-shadow:var(--shadow); transition:transform .17s, border-color .17s;
    }
    .icon-btn:hover { transform:translateY(-1px); border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .icon-btn svg { width:20px; height:20px; }
    .icon-btn:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }

    /* ---- search ------------------------------------------------------
       Lives behind the header's magnifier now, so it costs no width until
       you actually want it. Closing it clears the query — a hidden filter
       with no visible box to clear would just look like a broken page. */
    .search-wrap { margin-bottom:28px; }
    .search-wrap[hidden] { display:none; }
    .search-empty { margin:12px 2px 0; font-size:14px; color:var(--faint); }
    .search-empty[hidden] { display:none; }
    /* search filtering: rows/tiles/sections that don't match drop out.
       !important because most of these are flex or grid items. */
    .search-hidden { display:none !important; }
    /* a collapsed Drive section (or subfolder list) still shows its matches
       while a search is running — the collapse state itself is left alone,
       so clearing the search restores exactly what you had open. */
    body.is-searching #driveBody[hidden]:not(.search-hidden),
    body.is-searching .src-sub[hidden]:not(.search-hidden) { display:block !important; }
    /* results stack in one column so they read top-to-bottom instead of
       stranding a half-empty sidebar next to a blank left column */
    body.is-searching .cols { display:flex; flex-direction:column; gap:30px; align-items:stretch; }
    body.is-searching .col { gap:30px; }
    .search-box {
      display:flex; align-items:center; gap:10px;
      background:var(--card); border:1px solid color-mix(in srgb,var(--brand) 20%,var(--line));
      border-radius:999px; padding:11px 16px; box-shadow:var(--shadow);
    }
    .search-box svg { width:16px; height:16px; color:var(--faint); flex:none; }
    .search-box input {
      font:inherit; font-size:14.5px; flex:1; min-width:0; border:0; background:transparent;
      color:var(--ink); outline:none;
    }
    .search-box input::placeholder { color:var(--faint); }
    .search-box:focus-within { border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .search-kbd {
      flex:none; font-size:11px; font-weight:650; color:var(--faint);
      border:1px solid var(--line); border-radius:5px; padding:2px 6px;
    }

    /* ---- layout -------------------------------------------------------
       Left column: tile sections. Right column: pins + list. */
    main.cols { margin-top:0; min-width:0; max-width:100%; margin-bottom:40px; }
    @media (min-width:960px){
      .cols {
        display:grid;
        grid-template-columns:minmax(0,63fr) minmax(300px,37fr);
        gap:44px;
        align-items:start;
      }
      .col { display:flex; flex-direction:column; gap:34px; min-width:0; }
    }
    @media (max-width:959px){
      .cols { display:flex; flex-direction:column; gap:30px; }
      .col { display:flex; flex-direction:column; gap:30px; min-width:0; max-width:100%; }
    }

    .panel { min-width:0; }
    .panel-head {
      margin:0 0 12px; padding-bottom:7px;
      border-bottom:1px solid var(--line);
      box-shadow:inset 0 -2px 0 -1px var(--rule-brass);
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .panel-title {
      display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700;
      letter-spacing:.16em; text-transform:uppercase; color:var(--eyebrow-deep); margin:0;
    }
    .panel-title::before { content:""; flex:none; width:4px; height:11px; border-radius:2px; background:var(--eyebrow); }
    .panel-title--anchor::before,
    .panel-title--waves::before,
    .panel-title--compass::before { display:none; }
    .panel-title--anchor .panel-mark,
    .panel-title--waves .panel-mark,
    .panel-title--anchor .panel-mark,
    .panel-title--waves .panel-mark,
    .panel-title--compass .panel-mark { flex:none; width:13px; height:13px; color:var(--eyebrow); }
    .head-actions { margin-left:auto; display:flex; gap:6px; align-items:center; }

    /* ---- Status panel (Live + CI) -------------------------------------
       Compact sidebar panel below Duty List — live prod probes plus latest
       GitHub Actions runs so a down site / broken deploy is obvious. */
    .sidebar .panel--ci { padding:10px 14px 12px; }
    .panel--ci.is-collapsed { padding-bottom:10px; }
    .panel--ci .panel-head { margin-bottom:6px; padding-bottom:5px; }
    .panel--ci.is-collapsed .panel-head { margin-bottom:0; }
    .panel--ci .panel-title { font-size:10px; letter-spacing:.14em; }
    .panel--ci .panel-title::before { height:9px; }
    .status-toggle {
      display:flex; align-items:center; gap:8px;
      font:inherit; background:none; border:0; padding:0; cursor:pointer; color:inherit;
    }
    .status-toggle .panel-title::before { display:none; }
    .status-toggle:focus-visible {
      outline:none; border-radius:4px;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .status-summary-dot {
      flex:none; width:8px; height:8px; border-radius:50%; background:var(--faint);
    }
    .status-summary-dot.is-ok { background:var(--ok); }
    .status-summary-dot.is-fail { background:var(--danger); }
    .status-summary-dot.is-pending { background:var(--hue-3); animation:ci-pulse 1.4s ease-in-out infinite; }
    .ci-refresh {
      font-size:10px; font-weight:700; letter-spacing:.04em; color:var(--faint);
      background:none; border:0; cursor:pointer; padding:1px 3px; border-radius:4px;
    }
    .ci-refresh:hover { color:var(--muted); background:var(--hover-tint); }
    .ci-rows {
      list-style:none; margin:0; padding:0;
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 8px;
    }
    .panel--ci.is-collapsed .ci-rows,
    #ciStatus[hidden] { display:none; }
    .ci-group {
      grid-column:1 / -1; padding:7px 2px 2px;
    }
    .ci-group:first-child { padding-top:0; }
    .ci-group-label {
      font-size:9px; font-weight:700; letter-spacing:.12em;
      text-transform:uppercase; color:var(--faint);
    }
    .ci-row { min-width:0; }
    .ci-row-main {
      display:flex; align-items:center; gap:6px; padding:4px 2px;
      text-decoration:none; color:inherit; border-radius:5px; transition:background .15s;
    }
    a.ci-row-main:hover { background:var(--hover-tint); }
    .ci-dot { flex:none; width:6px; height:6px; border-radius:50%; background:var(--faint); }
    .ci-dot.is-ok { background:var(--ok); }
    .ci-dot.is-fail { background:var(--danger); }
    .ci-dot.is-pending { background:var(--hue-3); animation:ci-pulse 1.4s ease-in-out infinite; }
    .ci-dot.is-warn { background:var(--hue-3); }
    @keyframes ci-pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
    .ci-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:0; }
    .ci-name { font-size:11.5px; font-weight:650; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ci-meta { font-size:10px; line-height:1.2; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ci-row.is-fail .ci-meta { color:var(--danger); }

    /* ---- week strip ---------------------------------------------------
       Sits above Drive in the left column. Pick a day, add simple notes
       as pills below the date — synced like pins and list items. */
    .cal-head {
      display:flex; flex-direction:column; gap:8px;
      padding:2px 0 10px; margin-bottom:0;
    }
    .cal-title-row {
      display:flex; align-items:center; gap:10px; width:100%; min-height:34px;
    }
    .cal-date {
      flex:0 1 auto; min-width:0; margin:0;
      font-family:var(--display); font-weight:700; letter-spacing:-0.01em;
      font-size:clamp(17px,2.1vw,22px); line-height:1; color:var(--ink);
    }
    .cal-nav { flex:none; display:flex; align-items:center; gap:6px; margin-left:auto; }
    .cal-arrow {
      width:34px; height:34px; flex:none; display:grid; place-items:center;
      background:var(--card); border:1px solid var(--line); border-radius:9px;
      color:var(--muted); cursor:pointer; transition:color .15s, border-color .15s;
    }
    .cal-arrow svg { width:16px; height:16px; }
    .cal-arrow:hover { color:var(--brand); border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .cal-today {
      flex:none; font:inherit; font-size:12.5px; font-weight:650; color:var(--brand);
      background:none; border:0; padding:4px 6px; cursor:pointer;
      text-decoration:underline; text-underline-offset:2px;
    }
    .cal-today[hidden] { display:none; }
    .cal-arrow:focus-visible, .cal-today:focus-visible, .cal-day:focus-visible {
      outline:none; border-radius:9px;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .cal-week {
      list-style:none; margin:0; padding:6px 0 0;
      border-top:1px solid var(--line);
      box-shadow:inset 0 2px 0 -1px var(--rule-brass);
      display:grid; grid-template-columns:repeat(7,minmax(0,1fr));
      align-items:start;
    }
    .cal-cell {
      display:flex; flex-direction:column; align-items:center; min-width:0;
    }
    .cal-day {
      width:100%; display:flex; flex-direction:column; align-items:center; gap:9px;
      background:none; border:0; padding:10px 0 4px; font:inherit; color:inherit;
      cursor:pointer; border-radius:10px;
    }
    .cal-dow {
      font-size:11px; font-weight:650; letter-spacing:.12em;
      text-transform:uppercase; color:var(--faint);
    }
    .cal-num {
      position:relative;
      width:38px; height:38px; display:grid; place-items:center; border-radius:50%;
      font-size:16px; font-variant-numeric:tabular-nums; line-height:1;
      /* background only — transitioning color here also animates the theme
         toggle, so the numbers would lag behind the rest of the page. */
      transition:background .15s;
    }
    .cal-day:hover:not([aria-pressed="true"]) .cal-num { background:var(--hover-tint); }
    /* today, when you're looking at some other day */
    .cal-day.is-today .cal-num {
      box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 55%,transparent);
      color:var(--brand-deep); font-weight:700;
    }
    /* the day you're actually on */
    .cal-day[aria-pressed="true"] .cal-num {
      background:var(--brand); color:var(--on-accent); font-weight:700; box-shadow:none;
    }
    .cal-day[aria-pressed="true"] .cal-dow { color:var(--muted); }
    .cal-day-notes {
      display:flex; flex-direction:column; align-items:stretch; gap:4px;
      width:100%; padding:0 3px 8px;
    }
    .cal-pill {
      position:relative;
      display:flex; align-items:center; justify-content:center; width:100%;
      font-size:10px; font-weight:500; line-height:1.2;
      padding:4px 16px; border-radius:999px;
      background:color-mix(in srgb,var(--brand) 7%,var(--card));
      border:1px solid color-mix(in srgb,var(--brand) 16%,var(--line));
      color:var(--muted);
    }
    .cal-pill-text { width:100%; text-align:center; overflow-wrap:anywhere; }
    .cal-pill-del {
      position:absolute; right:3px; top:50%; transform:translateY(-50%);
      flex:none; width:14px; height:14px; display:grid; place-items:center;
      border:0; background:none; color:var(--faint); cursor:pointer;
      font-size:11px; line-height:1; border-radius:50%; padding:0; opacity:.75;
    }
    .cal-pill-del:hover { color:var(--danger); opacity:1; background:transparent; }
    .cal-add-btn {
      flex:none; width:28px; height:28px; border-radius:999px;
      border:1px dashed color-mix(in srgb,var(--earth) 42%,var(--line));
      background:color-mix(in srgb,var(--earth-tint) 55%,var(--card));
      color:var(--earth-deep); cursor:pointer;
      font-size:17px; font-weight:400; line-height:1; padding:0 0 1px;
      display:grid; place-items:center; transition:border-color .15s, color .15s;
    }
    .cal-add-btn:hover { border-color:var(--earth); color:var(--earth-deep); }
    .cal-add-btn:focus-visible, .cal-pill-del:focus-visible {
      outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .cal-add-form {
      display:flex; flex-wrap:wrap; gap:8px; width:100%; padding:8px 0 0;
    }
    .cal-add-form[hidden] { display:none; }
    .cal-add-form input {
      flex:1; min-width:0; font:inherit; font-size:14px;
      padding:8px 11px; border:1px solid var(--line); border-radius:8px;
      background:var(--paper-2); color:var(--ink);
    }
    .cal-add-form input:focus { outline:none; border-color:var(--brand); background:var(--card); }
    @media (max-width:520px){
      .cal-num { width:34px; height:34px; font-size:15px; }
      .cal-day { gap:7px; }
    }

    /* ---- flat source list (Drive / Websites) --------------------------
       No card chrome — rows separated by hairlines, same language as the
       Pins/List sidebar. Drive rows can expand to reveal subfolders. */
    .src-block { margin-bottom:22px; }
    .src-block:last-child { margin-bottom:0; }
    .src-head {
      display:flex; align-items:center; gap:12px; padding:2px 0 16px;
      border-bottom:1px solid var(--line);
      box-shadow:inset 0 -2px 0 -1px var(--rule-brass);
    }
    .src-head-icon {
      flex:none; width:34px; height:34px; border-radius:9px; display:grid; place-items:center;
      background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
    }
    .src-head-icon img { width:20px; height:20px; display:block; }
    .src-head-name { font-size:17px; font-weight:700; flex:1; min-width:0; }
    .src-head-toggle {
      flex:none; font:inherit; font-size:13px; font-weight:600; color:var(--muted); background:none; border:0;
      cursor:pointer; display:flex; align-items:center; gap:5px; padding:4px 2px;
    }
    .src-head-toggle svg { width:14px; height:14px; transition:transform .15s; }
    .src-head-toggle[aria-expanded="true"] svg { transform:rotate(180deg); }

    .src-quick {
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      text-decoration:none; color:var(--muted);
      font-style:italic; font-size:14px; padding:12px 2px; border-bottom:1px solid var(--line-soft);
      transition:color .15s;
    }
    .src-quick:hover { color:var(--brand); }
    .src-quick svg { flex:none; width:14px; height:14px; opacity:.6; }

    .src-rows {
      list-style:none; margin:0; padding:0;
      display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:row; column-gap:32px;
    }
    #driveBody > .src-rows { padding-inline-start:14px; }
    .src-row { border-bottom:1px solid var(--line-soft); }
    .src-row-main {
      display:flex; align-items:center; gap:11px; padding:12px 2px;
      text-decoration:none; color:inherit; cursor:pointer;
      background:none; border:0; width:100%; text-align:left; font:inherit;
      border-radius:6px; transition:background .15s;
    }
    a.src-row-main:hover, button.src-row-main:hover { background:var(--hover-tint); }
    .src-dot {
      flex:none; width:7px; height:7px; border-radius:1px;
      background:var(--accent,var(--brand)); transform:rotate(45deg);
    }
    .src-row-name { flex:1; min-width:0; font-size:15px; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .src-row-count {
      flex:none; font-size:13px; color:var(--muted); background:var(--paper-2);
      border-radius:999px; padding:2px 10px; min-width:22px; text-align:center;
    }
    .src-row-chevron { flex:none; width:15px; height:15px; color:var(--faint); transition:transform .15s; }
    .src-row-chevron.is-open { transform:rotate(90deg); }
    .src-row-external { flex:none; width:13px; height:13px; color:var(--faint); opacity:.7; }

    .src-sub { list-style:none; margin:0 0 4px; padding:0 0 0 20px; grid-column:1 / -1; }
    .src-sub .src-row-main { padding:9px 2px; }
    .src-sub .src-row-name { font-size:14px; font-weight:400; }
    .src-sub .src-dot { width:6px; height:6px; }

    .src-row.is-soon .src-row-main { opacity:.5; pointer-events:none; }
    .src-soon-tag {
      flex:none; font-size:9.5px; font-weight:700; letter-spacing:.06em;
      text-transform:uppercase; color:var(--faint); border:1px solid var(--line); border-radius:999px;
      padding:1px 6px;
    }
    @media (max-width:520px){
      .src-rows { grid-template-columns:1fr; }
    }

    /* ---- app grid (My Websites) — icon tiles, two columns ------------- */
    .app-grid { display:grid; grid-template-columns:1fr 1fr; }
    .app-tile {
      display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
      padding:14px 4px; border-bottom:1px solid var(--line-soft);
      border-radius:8px; transition:background .15s;
    }
    .app-tile:hover { background:var(--hover-tint); }
    .app-tile:nth-child(odd) { padding-right:16px; }
    .app-tile:nth-child(even) { padding-left:16px; }
    .app-icon {
      flex:none; width:44px; height:44px; border-radius:12px; display:grid; place-items:center;
      font-weight:700; font-size:15px; color:var(--on-accent);
      background:var(--accent,var(--brand));
    }
    .app-icon img { width:100%; height:100%; border-radius:12px; display:block; object-fit:cover; }
    .app-icon.is-emoji { font-size:24px; font-weight:400; color:inherit; line-height:1; }
    .app-body { min-width:0; flex:1; display:flex; flex-direction:column; }
    .app-name { display:block; font-size:15px; font-weight:650; line-height:1.3; margin:0 0 2px; }
    .app-desc { display:block; font-size:12.5px; color:var(--muted); line-height:1.4; margin:0; overflow-wrap:anywhere; }
    .app-external { flex:none; width:14px; height:14px; color:var(--faint); }
    @media (max-width:520px){
      .app-grid { grid-template-columns:1fr; }
      .app-tile:nth-child(odd), .app-tile:nth-child(even) { padding-inline:4px; }
    }

    /* ---- shared empty state (pins, list) ------------------------------ */
    .list-empty { color:var(--faint); font-size:14px; text-align:center; padding:16px 8px; }

    /* ---- jump links (pins) --------------------------------------------- */
    .links { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
    .links a {
      --link-accent:var(--earth);
      display:flex; align-items:center; gap:11px; text-decoration:none; padding:10px 4px;
      border-radius:7px; border:0; border-bottom:1px solid var(--line-soft);
      background:transparent;
      transition:background .15s, border-color .15s;
    }
    .links > li:last-child a { border-bottom:none; }
    .links a:hover {
      background:var(--hover-tint); border-bottom-color:transparent;
      box-shadow:inset 2px 0 0 var(--link-accent);
    }
    .link-icon {
      width:24px; height:24px; border-radius:50%; flex:none;
      display:grid; place-items:center;
      background:color-mix(in srgb,var(--link-accent) 16%,var(--card));
      color:var(--link-accent);
      border:1px solid color-mix(in srgb,var(--link-accent) 22%,var(--line));
    }
    .link-icon svg { width:13px; height:13px; display:block; }
    .links .lname { font-size:14.5px; font-weight:600; flex:1; min-width:0; line-height:1.35; }
    .links .larr {
      flex:none; width:20px; height:20px; border-radius:999px;
      display:grid; place-items:center; font-size:13px; line-height:1;
      color:var(--muted); background:transparent;
      opacity:.7; transition:opacity .15s, transform .15s, color .15s;
    }
    .links a:hover .larr { color:var(--link-accent); opacity:1; transform:translate(1px,-1px); }
    .links a:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--link-accent) 40%,transparent);
    }

    /* ---- sidebar (pins + list) ----------------------------------------- */
    .sidebar .panel {
      background:var(--panel-sidebar-bg);
      border:1px solid var(--panel-sidebar-border);
      border-radius:var(--radius); padding:12px 14px 14px;
      box-shadow:var(--panel-sidebar-shadow);
    }
    .sidebar .panel-head { margin-bottom:10px; }
    .sidebar .head-link {
      font:inherit; font-size:13px; font-weight:650; color:var(--brand);
      background:none; border:0; padding:0; cursor:pointer; text-decoration:none;
    }
    .sidebar .head-link:hover { text-decoration:underline; text-underline-offset:2px; }
    .sidebar .head-link[aria-pressed="true"] { color:var(--brand-deep); }
    .sidebar .head-link:focus-visible {
      outline:none; border-radius:4px;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .sidebar .links a { padding:11px 4px; gap:10px; }
    .sidebar .links a:hover { background:var(--hover-tint); border-bottom-color:var(--line-soft); box-shadow:none; }
    .sidebar .link-icon { width:20px; height:20px; background:var(--link-accent); color:var(--on-accent); border:none; }
    .sidebar .link-icon svg { width:11px; height:11px; }
    .sidebar .links .lname { font-size:14px; font-weight:600; }
    .sidebar .links .larr { width:auto; height:auto; font-size:13px; opacity:.5; transform:none; }
    .sidebar .links a:hover .larr { opacity:.85; transform:none; }
    .sidebar .list-empty { text-align:left; padding:8px 4px 12px; }
    .sidebar .pin-manage {
      display:flex; align-items:center; gap:10px;
      padding:11px 4px; border-bottom:1px solid var(--line-soft);
    }
    .sidebar .pin-manage:last-child { border-bottom:none; }
    .sidebar .pin-manage .pin-label { flex:1; min-width:0; font-size:14px; font-weight:600;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* ---- pins ----------------------------------------------------------- */
    .pin-row { display:flex; align-items:center; gap:8px; }
    .pin-row .links { flex:1; min-width:0; }
    .pin-actions { display:flex; gap:6px; flex:none; }
    .mini-btn {
      font:inherit; font-size:12px; font-weight:650; cursor:pointer; color:var(--muted);
      background:var(--paper-2); border:1px solid var(--line); border-radius:8px;
      padding:5px 9px; line-height:1.2; transition:border-color .15s, color .15s;
    }
    .mini-btn:hover { color:var(--ink); border-color:color-mix(in srgb,var(--brand) 40%,var(--line)); }
    .mini-btn[aria-pressed="true"] { color:var(--brand-deep); border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); }
    .mini-btn.icon-only {
      display:inline-flex; align-items:center; justify-content:center;
      line-height:0; min-width:28px; min-height:28px; padding:5px 7px;
    }
    .mini-btn.icon-only svg { width:14px; height:14px; display:block; flex-shrink:0; }
    .mini-btn:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .mini-btn:disabled { opacity:.45; cursor:default; }
    .mini-btn:disabled:hover { color:var(--muted); border-color:var(--line); }

    /* ---- pin editor ------------------------------------------------------ */
    .pin-form { border:0; border-top:1px solid var(--line); border-radius:0; background:transparent; padding:14px 0 4px; margin-top:8px; }
    .pin-form label { display:block; font-size:11px; font-weight:650; letter-spacing:.06em;
      text-transform:uppercase; color:var(--faint); margin:0 0 4px; }
    .pin-form input[type="text"], .pin-form input[type="url"] {
      font:inherit; font-size:14px; width:100%; color:var(--ink); background:var(--card);
      border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:10px;
    }
    .pin-form input:focus { outline:none; border-color:var(--brand); }
    .swatches { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .swatch {
      width:26px; height:26px; border-radius:50%; cursor:pointer; padding:0;
      border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
    }
    .swatch[aria-pressed="true"] { border-color:var(--ink); }
    .swatch:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .icon-picks { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .icon-pick {
      width:32px; height:32px; border-radius:8px; cursor:pointer; padding:0;
      display:grid; place-items:center; color:var(--muted);
      background:var(--card); border:1px solid var(--line);
      transition:border-color .15s, color .15s, background .15s;
    }
    .icon-pick svg { width:16px; height:16px; display:block; }
    .icon-pick[aria-pressed="true"] {
      border-color:var(--brand); color:var(--brand-deep); background:var(--brand-tint);
    }
    .icon-pick:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .form-actions { display:flex; gap:8px; align-items:center; }
    .btn-sm { font:inherit; font-size:13px; font-weight:650; cursor:pointer; border-radius:8px; padding:7px 13px; }
    .btn-primary { background:var(--brand); border:1px solid var(--brand); color:var(--on-accent); }
    .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
    .btn-danger { background:transparent; border:1px solid var(--line); color:var(--danger); margin-left:auto; }
    .btn-sm:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }

    /* ---- my list ----------------------------------------------------- */
    .sidebar .todo-add { margin-bottom:10px; }
    .sidebar .todo-add[hidden] { display:none; }
    .sidebar .todo-add input { padding:9px 11px; font-size:14px; }
    .sidebar .todo-add .btn-primary {
      flex:none; background:var(--ink); border-color:var(--ink);
      padding:10px 14px; border-radius:8px;
    }
    .sidebar .todo-add .btn-primary:hover { background:color-mix(in srgb,var(--ink) 88%,var(--brand)); border-color:color-mix(in srgb,var(--ink) 88%,var(--brand)); }
    .sidebar .todo { padding:11px 4px; align-items:center; }
    .sidebar .todo-check { width:16px; height:16px; border-radius:3px; margin-top:0; }
    .sidebar .todo.done .todo-check { background:var(--ok); border-color:var(--ok); }
    .sidebar .todo-text { font-size:14px; line-height:1.4; }
    .todo-add { display:flex; gap:8px; margin-bottom:12px; }
    .todo-add input {
      font:inherit; font-size:14px; flex:1; min-width:0; color:var(--ink); background:var(--card);
      border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px;
    }
    .todo-add input:focus { outline:none; border-color:var(--brand); background:var(--card); }
    .todos { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
    .todo {
      display:flex; align-items:flex-start; gap:10px; padding:10px 4px;
      border:0; border-bottom:1px solid var(--line-soft); border-radius:7px;
      background:transparent;
      transition:background .15s, border-color .15s, opacity .15s;
    }
    .todos > .todo:last-child { border-bottom:none; }
    .todo:hover { background:var(--hover-tint); border-bottom-color:transparent; }
    .todo-check {
      flex:none; width:18px; height:18px; margin-top:1px; border-radius:5px; cursor:pointer; padding:0;
      border:1.5px solid var(--idle); background:transparent; display:grid; place-items:center; color:var(--on-accent);
    }
    .todo-check svg { width:12px; height:12px; opacity:0; }
    .todo.done .todo-check { background:var(--ok); border-color:var(--ok); }
    .todo.done .todo-check svg { opacity:1; }
    .todo-text {
      flex:1; min-width:0; font-size:14px; line-height:1.45; cursor:text;
      word-break:break-word; white-space:pre-wrap;
    }
    .todo.done { opacity:.55; }
    .todo.done .todo-text { text-decoration:line-through; }
    .todo-edit {
      font:inherit; font-size:14px; flex:1; min-width:0; color:var(--ink);
      background:var(--card); border:1px solid var(--brand); border-radius:6px; padding:3px 6px;
    }
    .todo-edit:focus { outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent); }
    .todo-actions {
      flex:none; display:flex; align-items:center; gap:6px;
      opacity:0; transition:opacity .15s;
    }
    .todo:hover .todo-actions, .todo-actions:focus-within { opacity:1; }
    .todo-actions .mini-btn { padding:3px 6px; font-size:12px; line-height:1; }
    /* while the Add form is open the list is in "arrange" mode: the reorder
       arrows stay visible so you can shuffle items without hunting for hover */
    .todos.is-arranging .todo-actions { opacity:1; gap:2px; }
    .todo-move {
      flex:none; background:none; border:0; cursor:pointer; color:var(--faint);
      padding:2px 3px; border-radius:6px; display:grid; place-items:center;
      transition:color .15s;
    }
    .todo-move svg { width:14px; height:14px; }
    .todo-move:hover:not(:disabled) { color:var(--brand); }
    .todo-move:disabled { opacity:.3; cursor:default; }
    .todo-move:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .todo-del {
      flex:none; background:none; border:0; cursor:pointer; color:var(--faint);
      font-size:15px; line-height:1; padding:2px 4px; border-radius:6px; transition:color .15s;
    }
    .todo-del:hover { color:var(--danger); }
    .todo-del:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .todo-check:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .todo-text:focus-visible {
      outline:none; border-radius:6px;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }
    .todo-foot { display:flex; align-items:center; gap:10px; margin-top:12px; font-size:12.5px; color:var(--faint); }
    .todo-foot[hidden] { display:none; }
    .link-btn { font:inherit; font-size:12.5px; background:none; border:0; padding:0; cursor:pointer;
      color:var(--muted); text-decoration:underline; text-underline-offset:2px; }
    .link-btn:hover { color:var(--brand); }
    .link-btn:focus-visible {
      outline:none;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent);
    }

    /* ---- sync status ---------------------------------------------------- */
    .sync-note { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--faint); }
    .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--idle); flex:none; }
    .sync-note[data-state="saving"] .sync-dot { background:var(--wait); }
    .sync-note[data-state="saved"]  .sync-dot { background:var(--ok); }
    .sync-note[data-state="local"]  .sync-dot { background:var(--idle); }
    .sync-note[data-state="error"]  .sync-dot { background:var(--danger); }

    footer {
      display:flex; align-items:baseline; justify-content:space-between;
      flex-wrap:wrap; gap:6px 18px;
      margin-top:auto; padding-top:14px;
      border-top:1px solid var(--line);
      box-shadow:inset 0 2px 0 -1px var(--rule-brass);
      color:var(--muted); font-size:12.5px; text-align:left;
    }
    footer > span:first-child {
      font-family:var(--display); font-size:12px; letter-spacing:.01em; color:var(--faint);
    }
    .footer-motto { font-family:var(--sans); font-style:italic; color:var(--faint); opacity:.85; }
    footer a { color:var(--ink); font-weight:650; text-decoration:underline; text-underline-offset:2px; }
    footer a:hover { color:var(--brand); }

    @media (min-width:641px) and (max-width:1100px){
      :root { --header-top-pad: max(36px, calc(env(safe-area-inset-top, 0px) + 24px)); }
    }

    @media (max-width:640px){
      :root {
        --page-top-gutter: max(12px, env(safe-area-inset-top, 0px));
        --header-top-pad: max(24px, calc(env(safe-area-inset-top, 0px) + 12px));
      }
      body { padding:var(--page-top-gutter) 12px calc(28px + env(safe-area-inset-bottom)); }
      header.hero {
        margin-top:calc(-1 * var(--page-top-gutter));
        margin-bottom:18px;
        padding-inline:12px;
      }
      .hero-inner { padding:14px 0 12px; gap:12px; }
      .head-meta { margin-left:0; align-items:flex-start; text-align:left; }
      .todo, .links a, .tile { min-height:48px; }
    }

    @media (hover: none) {
      .todo-actions { opacity:1; }
      .tile:hover, .links a:hover, .icon-btn:hover { transform:none; }
    }
    .todo-check, .todo-del, .todo-actions .mini-btn, .pin-actions .mini-btn { position:relative; }
    .todo-check::after, .todo-del::after,
    .todo-actions .mini-btn::after, .pin-actions .mini-btn::after {
      content:""; position:absolute; inset:-3px;
    }

    @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
  </style>
  <script>
    try { var t = localStorage.getItem("tcc-theme"); if (t) document.documentElement.dataset.theme = t; } catch(e){}
  </script>
</head>
<body>
  <a class="skip-link" href="#board">Skip to links</a>
  <div class="wrap">
    <header class="hero">
      <div class="hero-inner">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v1.5"/>
            <path d="M9 3.5l.75.75"/>
            <path d="M15 3.5l-.75.75"/>
            <path d="M9 7.5V5.5h6v2"/>
            <path d="M9.5 7.5h5"/>
            <path d="M10 7.5 8.5 22"/>
            <path d="M14 7.5 15.5 22"/>
            <path d="M9.2 12h5.6"/>
            <path d="M8.8 16.5h6.4"/>
            <path d="M8 22h8"/>
          </svg>
        </span>
        <h1>EBHCS Command Center</h1>
        <div class="head-meta">
          <span class="greeting" id="greeting"></span>
        </div>
        <div class="head-right">
          <button class="icon-btn" id="searchToggle" type="button" aria-label="Search" aria-expanded="false" aria-controls="searchWrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch color theme"></button>
        </div>
      </div>
    </header>

    <div class="search-wrap" id="searchWrap" hidden>
      <div class="search-box">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Search charts, sites, harbor pins, duty list, log…" aria-label="Search everything" autocomplete="off" />
        <span class="search-kbd" aria-hidden="true">/</span>
      </div>
      <p class="search-empty" id="searchEmpty" role="status" aria-live="polite" hidden></p>
    </div>

    <main class="cols" id="board">
      <!-- LEFT: week strip + Drive + Websites -->
      <div class="col">
        <section class="panel cal" data-section="Ship's Log" aria-labelledby="calDate">
          <div class="cal-head">
            <div class="cal-title-row">
              <h2 class="cal-date" id="calDate"></h2>
              <button class="cal-add-btn" type="button" id="calAddToggle" aria-label="Log entry for this day">+</button>
              <div class="cal-nav">
                <button class="cal-today" type="button" id="calToday" hidden>Today</button>
                <button class="cal-arrow" type="button" id="calPrev" aria-label="Previous week">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button class="cal-arrow" type="button" id="calNext" aria-label="Next week">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
            </div>
            <form class="cal-add-form" id="calAddForm" hidden>
              <input type="text" id="calInput" maxlength="80" placeholder="First day of class…"
                     autocomplete="off" aria-label="Log entry for this day" />
              <button class="btn-sm btn-primary" type="submit">Log it</button>
              <button class="btn-sm btn-ghost" type="button" id="calAddCancel">Cancel</button>
            </form>
          </div>
          <ol class="cal-week" id="calWeek"></ol>
        </section>

        <section class="panel" data-section="Google Drive">
          <div id="src-drive"></div>
        </section>

        <section class="panel" data-section="My Websites">
          <div class="panel-head">
            <h2 class="panel-title panel-title--compass">
              <svg class="panel-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>
              </svg>
              My Websites
            </h2>
          </div>
          <div class="app-grid" id="src-sites"></div>
        </section>
      </div>

      <!-- RIGHT: pins + list -->
      <div class="col sidebar">
        <section class="panel" data-section="Harbor Pins">
          <div class="panel-head">
            <h2 class="panel-title panel-title--anchor">
              <svg class="panel-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="5" r="3"/>
                <path d="M12 22V8"/>
                <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
              </svg>
              Harbor Pins
            </h2>
            <div class="head-actions">
              <button class="head-link" type="button" id="pinManage" aria-pressed="false">Manage</button>
            </div>
          </div>
          <ul class="links" id="pins"></ul>
          <div id="pinEditor"></div>
        </section>

        <section class="panel" data-section="Duty List">
          <div class="panel-head">
            <h2 class="panel-title panel-title--waves">
              <svg class="panel-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
                <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>

  <script>
    /* =====================================================================
       EDIT HERE — this is the part you'll touch to add/change links.

       DRIVE_FOLDERS: top-level folders shown as a flat row list. Each is
       { name, url, accent } and can also carry "subfolders" (an array of
       { name, url }) which expand in place when the row is clicked — no

       becomes a toggle instead of a link, so its own "url" is unused.
       "soon: true" dims a row and makes it unclickable.

       The italic quick-open link above the folder rows comes from

       SITES: icon tiles, always a direct link. { name, desc, url, accent }
       plus "mono" (a letter), "icon" (image path), or "emoji" (glyph + accent bg).
       ===================================================================== */
    const DRIVE_ROOT_NAME = "FY27";
    const DRIVE_ROOT_URL = "https://drive.google.com/";
    const DRIVE_FOLDERS = [
      {

        subfolders:[
          { name:"Work Log", url:"https://docs.google.com/document/d/1K3wOLHHUupKRKLaDudUgQnae6TGt8qDCKQ7ZbJv6z9c/edit?tab=t.0#heading=h.thrsago4kpkb" },

          { name:"Materials FY24", url:"https://drive.google.com/drive/folders/1-z-3Y5nl72qu3bfEiFKak3LVQs11yXr9" },

    const SITES = [

      { name:"Resources Page", desc:"ESOL Level 3 resources", url:"https://esol-level-3.vercel.app/", icon:"icons/esol-resources.svg", accent:"var(--hue-5)" },

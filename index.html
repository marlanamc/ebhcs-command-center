    ];
    /* ===================================================================== */

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    const chevronSvg = '<svg class="src-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
    const chevronDownSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
    const externalSvg = '<svg class="src-row-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>';
    const openSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>';

    function renderDrive(){
      const el = document.getElementById("src-drive");
      if (!el) return;
      const rows = DRIVE_FOLDERS.map((f, i) => {
        const hasSub = Array.isArray(f.subfolders) && f.subfolders.length;
        const soonCls = f.soon ? " is-soon" : "";
        const tag = f.soon ? '<span class="src-soon-tag">Soon</span>' : "";
        const count = hasSub ? `<span class="src-row-count">${f.subfolders.length}</span>` : "";
        const chevron = hasSub ? chevronSvg : "";
        const subId = `drive-sub-${i}`;
        const rowInner = `
          <span class="src-dot" style="--accent:${f.accent || "var(--brand)"}" aria-hidden="true"></span>
          <span class="src-row-name">${escapeHtml(f.name)}</span>
          ${tag}${count}${chevron}`;
        const mainEl = hasSub
          ? `<button class="src-row-main" type="button" data-toggle="${subId}" aria-expanded="false" aria-controls="${subId}">${rowInner}</button>`
          : `<a class="src-row-main" href="${escapeHtml(f.url)}" target="_blank" rel="noopener noreferrer">${rowInner}</a>`;
        const subList = hasSub ? `
          <ul class="src-sub" id="${subId}" hidden>
            ${f.subfolders.map(sf => `
              <li class="src-row" data-search="${escapeHtml(sf.name)}">
                <a class="src-row-main" href="${escapeHtml(sf.url)}" target="_blank" rel="noopener noreferrer">
                  <span class="src-dot" style="--accent:${f.accent || "var(--brand)"}" aria-hidden="true"></span>
                  <span class="src-row-name">${escapeHtml(sf.name)}</span>
                </a>
              </li>`).join("")}
          </ul>` : "";
        /* data-search is the row's OWN name — without it a parent would match
           on its subfolders' text and drag the whole group into results. */
        return `<li class="src-row${soonCls}" data-search="${escapeHtml(f.name)}">${mainEl}${subList}</li>`;
      }).join("");

      el.innerHTML = `
        <div class="src-head">
          <span class="src-head-icon" aria-hidden="true"><img src="icons/google-drive.svg" alt="" /></span>
          <span class="src-head-name">Google Drive</span>
          <button class="src-head-toggle" type="button" id="driveCollapse" aria-expanded="true" aria-controls="driveBody">
            <span>${DRIVE_FOLDERS.length} folder${DRIVE_FOLDERS.length === 1 ? "" : "s"}</span>
            ${chevronDownSvg}
          </button>
        </div>
        <div id="driveBody">
          <a class="src-quick" href="${escapeHtml(DRIVE_ROOT_URL)}" target="_blank" rel="noopener noreferrer">
            <span>Open ${escapeHtml(DRIVE_ROOT_NAME)} folder</span>${openSvg}
          </a>
          <ul class="src-rows">${rows}</ul>
        </div>`;

      el.querySelectorAll("[data-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const sub = document.getElementById(btn.dataset.toggle);
          const open = sub.hidden;
          sub.hidden = !open;
          btn.setAttribute("aria-expanded", String(open));
          btn.querySelector(".src-row-chevron")?.classList.toggle("is-open", open);
        });
      });

      const collapseBtn = document.getElementById("driveCollapse");
      const driveBody = document.getElementById("driveBody");
      collapseBtn.addEventListener("click", () => {
        const open = driveBody.hidden;
        driveBody.hidden = !open;
        collapseBtn.setAttribute("aria-expanded", String(open));
      });
    }

    function renderSites(){
      const el = document.getElementById("src-sites");
      if (!el) return;
      el.innerHTML = SITES.map(s => {
        const iconCls = s.emoji ? " is-emoji" : "";
        const inner = s.icon ? `<img src="${s.icon}" alt="" />`
          : s.emoji ? escapeHtml(s.emoji)
          : escapeHtml(s.mono || "?");
        return `
        <a class="app-tile" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" style="--accent:${s.accent || "var(--brand)"}" data-search="${escapeHtml([s.name, s.desc, s.url].filter(Boolean).join(" "))}">
          <span class="app-icon${iconCls}" aria-hidden="true">${inner}</span>
          <span class="app-body">
            <span class="app-name">${escapeHtml(s.name)}</span>
            <span class="app-desc">${escapeHtml(s.desc || "")}</span>
          </span>
          ${externalSvg.replace('src-row-external', 'app-external')}
        </a>`;
      }).join("");
    }

    renderDrive();
    renderSites();

    /* ---- Status panel: Live prod + CI ---------------------------------
       Live probes prefer GET /api/status (Pages function). CI prefers
       GET /api/ci, with a public GitHub API fallback for local static
       serving. Both are cached 5 minutes under one key. */
    const STATUS_CACHE_KEY = "tcc-status-cache-v2";
    const STATUS_TTL_MS = 5 * 60 * 1000;
    const LIVE_SITES = [
      {
        id: "bulletin-board",
        label: "Bulletin Board",
        healthUrl: "https://ebhcsjobboard.web.app/student-feed-snapshot.json",
        fallbackUrl: "https://ebhcsjobboard.web.app/",
        kind: "snapshot",
      },
      {
        id: "esol-lms",
        label: "ESOL LMS",
        healthUrl: "https://myesolclass.com/api/health",
        fallbackUrl: "https://myesolclass.com/",
      },
    ];
    const CI_PUBLIC_PROJECTS = [
      {
        repo: "marlanamc/advisor-bulletin",
        label: "Bulletin Board",
        workflows: [
          { file: "deploy.yml", label: "Deploy" },
          { file: "full-test-matrix.yml", label: "Test Matrix" },
        ],
      },
      {
        repo: "marlanamc/esol-resources",
        label: "ESOL LMS",
        workflows: [
          { file: "ci.yml", label: "CI" },
          { file: "maintenance-weekly.yml", label: "Weekly" },
          { file: "maintenance-monthly.yml", label: "Monthly" },
          { file: "release-gate.yml", label: "Release Gate" },
        ],
      },
    ];

    function ciRelTime(iso){
      const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.round(hrs / 24)}d ago`;
    }

    async function ciFetchRun(repo, file){
      const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${file}/runs?per_page=1`, {
        headers: { Accept:"application/vnd.github+json" },
      });
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      const run = data.workflow_runs && data.workflow_runs[0];
      if (!run) return null;
      return { status:run.status, conclusion:run.conclusion, url:run.html_url, updatedAt:run.updated_at };
    }

    function ciStatusMeta(run){
      if (!run) return { cls:"is-unknown", label:"No runs yet" };
      if (run.status !== "completed") {
        return { cls:"is-pending", label: run.status === "in_progress" ? "Running…" : "Queued…" };
      }
      if (run.conclusion === "success") return { cls:"is-ok", label:ciRelTime(run.updatedAt) };
      if (["failure", "timed_out", "action_required"].includes(run.conclusion)) {
        return { cls:"is-fail", label:`Failed · ${ciRelTime(run.updatedAt)}` };
      }
      return { cls:"is-unknown", label:`${run.conclusion || "unknown"} · ${ciRelTime(run.updatedAt)}` };
    }

    function liveStatusMeta(site){
      if (!site || site.error) return { cls:"is-unknown", label:"Couldn't check" };
      if (site.ok) {
        const ms = typeof site.latencyMs === "number" ? `${site.latencyMs}ms` : "";
        return { cls:"is-ok", label: ms ? `Up · ${ms}` : "Up" };
      }
      return { cls:"is-fail", label:"Down" };
    }

    function liveRowHtml(site){
      const meta = liveStatusMeta(site);
      const href = (site && site.url) || (site && site.fallbackUrl) || "#";
      return `
        <li class="ci-row ${meta.cls === "is-fail" ? "is-fail" : ""}">
          <a class="ci-row-main" href="${href}" target="_blank" rel="noopener noreferrer">
            <span class="ci-dot ${meta.cls}" aria-hidden="true"></span>
            <span class="ci-text">
              <span class="ci-name">${escapeHtml(site.label || "Site")}</span>
              <span class="ci-meta">${escapeHtml(meta.label)}</span>
            </span>
          </a>
        </li>`;
    }

    function ciRowHtml(project, w){
      const meta = w.error ? { cls:"is-unknown", label:"Couldn't check" } : ciStatusMeta(w.run);
      const href = (w.run && w.run.url) || `https://github.com/${project.repo}/actions`;
      return `
        <li class="ci-row ${meta.cls === "is-fail" ? "is-fail" : ""}">
          <a class="ci-row-main" href="${href}" target="_blank" rel="noopener noreferrer">
            <span class="ci-dot ${meta.cls}" aria-hidden="true"></span>
            <span class="ci-text">
              <span class="ci-name">${escapeHtml(w.label)}</span>
              <span class="ci-meta">${escapeHtml(meta.label)}</span>
            </span>
          </a>
        </li>`;
    }

    function statusRender(el, sites, projects){
      const liveHtml = `
        <li class="ci-group"><span class="ci-group-label">Live</span></li>
        ${(sites && sites.length ? sites : LIVE_SITES.map(s => ({ ...s, error:true }))).map(liveRowHtml).join("")}`;
      const ciHtml = (projects || []).map(p => `
        <li class="ci-group"><span class="ci-group-label">${escapeHtml(p.label)}</span></li>
        ${p.workflows.map(w => ciRowHtml(p, w)).join("")}
      `).join("");
      el.innerHTML = liveHtml + ciHtml;
      updateStatusSummary(sites, projects);
      setStatusCollapsed(document.getElementById("statusPanel")?.classList.contains("is-collapsed") ?? true);
    }

    function computeStatusSummary(sites, projects){
      const classes = [];
      (sites || []).forEach(s => classes.push(liveStatusMeta(s).cls));
      (projects || []).forEach(p => {
        p.workflows.forEach(w => {
          const meta = w.error ? { cls:"is-unknown" } : ciStatusMeta(w.run);
          classes.push(meta.cls);
        });
      });
      if (!classes.length) return "pending";
      if (classes.some(c => c === "is-fail" || c === "is-unknown")) return "fail";
      if (classes.some(c => c === "is-pending")) return "pending";
      return "ok";
    }

    function updateStatusSummary(sites, projects){
      const dot = document.getElementById("statusSummaryDot");
      if (!dot) return;
      const summary = computeStatusSummary(sites, projects);
      dot.className = `status-summary-dot is-${summary}`;
    }

    function setStatusCollapsed(collapsed){
      const panel = document.getElementById("statusPanel");
      const list = document.getElementById("ciStatus");
      const toggle = document.getElementById("statusToggle");
      if (!panel || !list || !toggle) return;
      panel.classList.toggle("is-collapsed", collapsed);
      list.hidden = collapsed;
      toggle.setAttribute("aria-expanded", String(!collapsed));
    }

    async function probeLiveSiteClient(site){
      const started = Date.now();
      try {
        const res = await fetch(site.healthUrl, { cache:"no-store" });
        const latencyMs = Date.now() - started;
        const contentType = res.headers.get("content-type") || "";
        if (res.ok && contentType.includes("application/json")) {
          const body = await res.json();
          if (site.kind === "snapshot" && body && Array.isArray(body.items) && body.generatedAt) {
            return {
              id: site.id,
              label: site.label,
              ok: true,
              source: "snapshot",
              db: null,
              latencyMs,
              url: site.fallbackUrl,
            };
          }
          if (body && typeof body.ok === "boolean") {
            return {
              id: site.id,
              label: site.label,
              ok: body.ok === true && body.db !== "fail",
              source: "health",
              db: body.db ?? null,
              latencyMs: typeof body.latencyMs === "number" ? body.latencyMs : latencyMs,
              url: site.fallbackUrl,
            };
          }
        }
        const homeStarted = Date.now();
        const home = await fetch(site.fallbackUrl, { cache:"no-store", mode:"no-cors" });
        // no-cors opaque responses are type "opaque"; treat as reachable if no throw.
        return {
          id: site.id,
          label: site.label,
          ok: home.type === "opaque" || home.ok,
          source: "homepage",
          db: null,
          latencyMs: Date.now() - homeStarted,
          url: site.fallbackUrl,
        };
      } catch {
        return { id:site.id, label:site.label, ok:false, source:"error", db:null, latencyMs:Date.now() - started, url:site.fallbackUrl, error:true };
      }
    }

    async function fetchLiveSites(){
      try {
        const res = await fetch("/api/status", { cache:"no-store" });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.sites)) return data.sites;
        }
      } catch {}
      return Promise.all(LIVE_SITES.map(probeLiveSiteClient));
    }

    async function ciFetchProjectsClient(){
      return Promise.all(CI_PUBLIC_PROJECTS.map(async (project) => {
        const workflows = await Promise.all(project.workflows.map(async (w) => {
          try { return { ...w, run: await ciFetchRun(project.repo, w.file) }; }
          catch { return { ...w, run:null, error:true }; }
        }));
        return { repo:project.repo, label:project.label, workflows };
      }));
    }

    async function ciFetchProjects(){
      try {
        const res = await fetch("/api/ci", { cache:"no-store" });
        if (res.ok) return (await res.json()).projects;
      } catch {}
      return ciFetchProjectsClient();
    }

    async function loadStatusPanel(force){
      const el = document.getElementById("ciStatus");
      if (!el) return;

      let cache = null;
      try { cache = JSON.parse(localStorage.getItem(STATUS_CACHE_KEY) || "null"); } catch {}
      const fresh = cache && (Date.now() - cache.ts) < STATUS_TTL_MS;

      if (fresh && !force){
        statusRender(el, cache.sites, cache.projects);
        return;
      }
      if (cache) statusRender(el, cache.sites, cache.projects);
      else {
        updateStatusSummary(null, null);
        el.innerHTML = `<li class="ci-row" style="grid-column:1/-1"><span class="ci-row-main"><span class="ci-dot is-pending" aria-hidden="true"></span><span class="ci-text"><span class="ci-name">Checking status…</span></span></span></li>`;
        setStatusCollapsed(document.getElementById("statusPanel")?.classList.contains("is-collapsed") ?? true);
      }

      try {
        const [sites, projects] = await Promise.all([fetchLiveSites(), ciFetchProjects()]);
        localStorage.setItem(STATUS_CACHE_KEY, JSON.stringify({ ts:Date.now(), sites, projects }));
        statusRender(el, sites, projects);
      } catch {
        // Network down or rate-limited: leave stale cache showing.
      }
    }

    document.getElementById("statusToggle")?.addEventListener("click", () => {
      const panel = document.getElementById("statusPanel");
      setStatusCollapsed(!panel?.classList.contains("is-collapsed"));
    });
    document.getElementById("ciRefresh")?.addEventListener("click", (e) => {
      e.stopPropagation();
      loadStatusPanel(true);
    });
    setStatusCollapsed(true);
    loadStatusPanel(false);

    /* ---- search: filters everything on the page ----------------------
       Drive folders + subfolders, the Drive quick links, website tiles,
       pins, and list items. Items carry a data-search string when the
       useful text isn't all on screen (a site's URL, a pin's URL);
       everything else falls back to its visible text. Sections with no
       matches left drop out entirely. */
    const searchInput = document.getElementById("searchInput");
    const searchEmptyEl = document.getElementById("searchEmpty");
    const searchWrap = document.getElementById("searchWrap");
    const searchToggle = document.getElementById("searchToggle");

    function setSearchOpen(open){
      searchWrap.hidden = !open;
      searchToggle.setAttribute("aria-expanded", String(open));
      if (open) { searchInput.focus(); searchInput.select(); return; }
      if (searchInput.value) { searchInput.value = ""; applySearch(); }
    }
    searchToggle.addEventListener("click", () => setSearchOpen(searchWrap.hidden));

    /* "/" is a shortcut, not a hijack — don't steal it out of a field the
       user is typing in (adding a list item, filling the pin form). */
    const isTyping = (el) => !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && !isTyping(document.activeElement) && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        setSearchOpen(true);
      }
      if (e.key === "Escape" && document.activeElement === searchInput) setSearchOpen(false);
    });

    function applySearch(){
      const raw = searchInput.value.trim();
      const q = raw.toLowerCase();
      const on = !!q;
      document.body.classList.toggle("is-searching", on);

      const hits = (el) => (el.dataset.search || el.textContent || "").toLowerCase().includes(q);
      const show = (el, visible) => el.classList.toggle("search-hidden", on && !visible);

      const counts = new Map();
      const bump = (el) => {
        const sec = el.closest("[data-section]");
        if (sec) counts.set(sec, (counts.get(sec) || 0) + 1);
      };

      // Drive folders: a folder stays if its own name matches, or any of its
      // subfolders do (in which case only the matching subfolders show).
      document.querySelectorAll("#src-drive .src-rows > .src-row").forEach(row => {
        const selfHit = hits(row);
        const sub = row.querySelector(".src-sub");
        let subHits = 0;
        if (sub) {
          sub.querySelectorAll(".src-row").forEach(sr => {
            const hit = selfHit || hits(sr);
            show(sr, hit);
            if (hit) subHits++;
          });
          show(sub, selfHit || subHits > 0);
        }
        const hit = selfHit || subHits > 0;
        show(row, hit);
        if (hit) bump(row);
      });

      // flat rows: quick links, site tiles, pins, list items
      ["#src-drive .src-quick", "#src-sites > .app-tile", "#pins > li", "#todos > li", ".cal-pill"].forEach(sel => {
        document.querySelectorAll(sel).forEach(el => {
          const hit = !el.classList.contains("list-empty") && hits(el);
          show(el, hit);
          if (hit) bump(el);
        });
      });

      let total = 0;
      document.querySelectorAll("[data-section]").forEach(sec => {
        const n = counts.get(sec) || 0;
        total += n;
        sec.classList.toggle("search-hidden", on && n === 0);
      });
      document.querySelectorAll(".col").forEach(col => {
        const alive = [...col.querySelectorAll("[data-section]")].some(s => !s.classList.contains("search-hidden"));
        col.classList.toggle("search-hidden", on && !alive);
      });

      searchEmptyEl.hidden = !on || total > 0;
      if (on && !total) searchEmptyEl.textContent = `Nothing matches “${raw}”.`;
    }

    searchInput.addEventListener("input", applySearch);

    // ---- greeting + date ----
    (function () {
      const h = new Date().getHours();
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const GREETINGS = {
        lateNight: ["Middle watch", "Quiet seas tonight", "Night watch", "Still at anchor", "Calm waters"],
        dawn: ["First light", "Dawn watch", "Fair morning", "Rising tide", "Daybreak on deck"],
        morning: ["Good morning", "Morning watch", "Fair winds", "Clear horizon", "All hands on deck"],
        afternoon: ["Good afternoon", "Afternoon watch", "Steady course", "Fair afternoon", "Full sail ahead"],
        evening: ["Good evening", "Evening watch", "Harbor bound", "Sun astern", "Making port"],
        night: ["Good night", "Stars on the chart", "Moon on the water", "Last watch", "Anchored for the night"],
      };
      let g;
      if (h < 5) g = pick(GREETINGS.lateNight);
      else if (h < 9) g = pick(GREETINGS.dawn);
      else if (h < 12) g = pick(GREETINGS.morning);
      else if (h < 17) g = pick(GREETINGS.afternoon);
      else if (h < 21) g = pick(GREETINGS.evening);
      else g = pick(GREETINGS.night);
      document.getElementById("greeting").textContent = g;
    })();

    /* ---- week strip — wired below after state is ready ---------------- */

    // ---- theme toggle ----
    (function () {
      const btn = document.getElementById("themeToggle");
      const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
      const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
      function current(){
        const t = document.documentElement.dataset.theme;
        if (t) return t;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function paint(){
        btn.innerHTML = current() === "dark" ? sunIcon : moonIcon;
        btn.setAttribute("aria-label", current() === "dark" ? "Switch to light theme" : "Switch to dark theme");
      }
      btn.addEventListener("click", () => {
        const next = current() === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("tcc-theme", next); } catch(e){}
        paint();
      });
      paint();
    })();

    /* =====================================================================
       PINS + LIST — synced to Cloudflare KV via /api/data, falls back to
       localStorage if the KV binding isn't set up yet (or you're offline).
       ===================================================================== */
    const LS_KEY = "tcc-data-v1";
    const API_URL = "/api/data";

    const PIN_COLORS = [
      "#1f5f6f", "#2a5478", "#a67c3a", "#3d7175", "#4e678a", "#965a22",
      "#3a7777", "#5c5348", "#1a7f5a", "#0077b6", "#5c4d7a", "#b3402c",
      "#6b5b4e", "#2d6a4f", "#8b6914", "#184952",
    ];
    const PIN_ICON_PATHS = {
      anchor: '<circle cx="12" cy="5" r="3"/><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/>',
      compass: '<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>',
      lighthouse: '<path d="M12 2v1.5"/><path d="M9 7.5V5.5h6v2"/><path d="M10 7.5 8.5 22"/><path d="M14 7.5 15.5 22"/><path d="M8 22h8"/>',
      waves: '<path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>',
      link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
      external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
      bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
      star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
      mappin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
      globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/>',
      book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
      mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
      calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
      folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
      home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    };
    const PIN_ICON_IDS = Object.keys(PIN_ICON_PATHS);
    const PIN_ICON_LABELS = {
      anchor:"Anchor", compass:"Compass", lighthouse:"Lighthouse", waves:"Waves",
      link:"Link", external:"External", bookmark:"Bookmark", star:"Star", flag:"Flag",
      mappin:"Map pin", globe:"Globe", book:"Book", mail:"Mail", calendar:"Calendar",
      folder:"Folder", home:"Home",
    };
    const DEFAULT_PIN_ICON = "anchor";
    const DEFAULT_PIN_COLOR = PIN_COLORS[0];

    function pinIconSvg(id) {
      const paths = PIN_ICON_PATHS[id] || PIN_ICON_PATHS[DEFAULT_PIN_ICON];
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
    }
    function normalizePinIcon(icon) {
      return PIN_ICON_PATHS[icon] ? icon : DEFAULT_PIN_ICON;
    }
    function pinIconHtml(icon) {
      return pinIconSvg(normalizePinIcon(icon));
    }
    const uid = () => Math.random().toString(36).slice(2, 10);

    let state = { v:1, pins:[], todos:[], events:[], updated:null };

    /* Anything coming from storage gets forced back into shape first. A
       half-written or older-shape payload used to throw on the first
       render and leave Pins + List permanently blank. */
    function dateKey(d){
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const y = x.getFullYear();
      const m = String(x.getMonth() + 1).padStart(2, "0");
      const day = String(x.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function normalizeState(raw){
      const o = raw && typeof raw === "object" ? raw : {};
      return {
        v: 1,
        pins: (Array.isArray(o.pins) ? o.pins : [])
          .filter(p => p && p.id && p.label)
          .map(p => ({ ...p, url: safeUrl(p.url), color: /^#[0-9a-fA-F]{6}$/.test(p.color || "") ? p.color : DEFAULT_PIN_COLOR }))
          .filter(p => p.url),
        todos: (Array.isArray(o.todos) ? o.todos : []).filter(t => t && t.id && typeof t.text === "string"),
        events: (Array.isArray(o.events) ? o.events : [])
          .filter(e => e && e.id && typeof e.text === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date || ""))
          .map(e => ({ id: String(e.id).slice(0, 40), date: e.date, text: String(e.text).slice(0, 80) })),
        updated: typeof o.updated === "string" ? o.updated : null,
      };
    }

    /* Same http(s)-only gate the API applies, so a "javascript:" URL can't
       become a live href on the way in from storage or the pin form. */
    function safeUrl(v){
      let raw = typeof v === "string" ? v.trim().slice(0, 2048) : "";
      if (!raw) return "";
      if (!/^[a-z][a-z0-9+.-]*:/i.test(raw)) raw = "https://" + raw;
      try {
        const u = new URL(raw);
        return (u.protocol === "http:" || u.protocol === "https:") ? u.href : "";
      } catch(e){ return ""; }
    }

    function loadLocal(){
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) state = normalizeState(JSON.parse(raw));
      } catch(e){}
    }
    function saveLocal(){
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
    }

    const syncSlot = document.getElementById("syncSlot");
    function setSync(mode){
      const label = { saving:"Logging…", saved:"Logged", local:"Logged on this device", error:"Couldn't sync" }[mode] || "";
      syncSlot.innerHTML = `<span class="sync-note" data-state="${mode}"><span class="sync-dot" aria-hidden="true"></span>${label}</span>`;
    }

    let saveTimer = null;
    function scheduleSave(){
      saveLocal();
      setSync("saving");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          const res = await fetch(API_URL, {
            method:"PUT",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(state),
          });
          /* 503 = no KV binding, 404 = no API at all (plain static host or
             `python -m http.server`). Both mean "there is no sync here",
             which is different from a sync that tried and failed. */
          if (res.status === 503 || res.status === 404) { setSync("local"); return; }
          if (!res.ok) throw new Error("save failed");
          setSync("saved");
        } catch(e){
          setSync("error");
        }
      }, 500);
    }

    async function loadRemote(){
      try {
        const res = await fetch(API_URL);
        if (res.status === 503 || res.status === 404) { setSync("local"); return; }
        if (!res.ok) throw new Error("load failed");
        const data = await res.json();
        if (data && Array.isArray(data.pins) && Array.isArray(data.todos)) {
          state = normalizeState(data);
          saveLocal();
          renderPins();
          renderTodos();
          renderCal();
          setSync("saved");
        }
      } catch(e){
        setSync("error");
      }
    }

    // ---- pins ----
    const pinsEl = document.getElementById("pins");
    const pinEditorEl = document.getElementById("pinEditor");
    const pinManageBtn = document.getElementById("pinManage");
    let pinManaging = false;
    let editingPinId = null;

    function renderPins(){
      if (!state.pins.length) {
        pinsEl.innerHTML = pinManaging ? "" : `<li class="list-empty">No pins yet — mark your harbor.</li>`;
      } else if (pinManaging) {
        pinsEl.innerHTML = state.pins.map(p => `
          <li class="pin-manage" data-id="${p.id}" data-search="${escapeHtml(p.label + " " + p.url)}">
            <span class="link-icon" style="--link-accent:${escapeHtml(p.color)}" aria-hidden="true">${pinIconHtml(p.icon)}</span>
            <span class="pin-label">${escapeHtml(p.label)}</span>
            <div class="pin-actions">
              <button class="mini-btn" type="button" data-edit="${p.id}">Edit</button>
              <button class="mini-btn" type="button" data-del="${p.id}">Delete</button>
            </div>
          </li>`).join("");
      } else {
        pinsEl.innerHTML = state.pins.map(p => `
          <li data-search="${escapeHtml(p.label + " " + p.url)}">
            <a href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer" style="--link-accent:${escapeHtml(p.color)}">
              <span class="link-icon" aria-hidden="true">${pinIconHtml(p.icon)}</span>
              <span class="lname">${escapeHtml(p.label)}</span>
              <span class="larr" aria-hidden="true">↗</span>
            </a>
          </li>`).join("");
      }
      renderPinEditorList();
      applySearch();
    }

    function renderPinEditorList(){
      pinsEl.querySelectorAll("[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => openPinForm(btn.dataset.edit));
      });
      pinsEl.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.pins = state.pins.filter(p => p.id !== btn.dataset.del);
          scheduleSave();
          renderPins();
        });
      });
    }

    function openPinForm(id){
      editingPinId = id || null;
      const pin = id ? state.pins.find(p => p.id === id) : { label:"", url:"", color:DEFAULT_PIN_COLOR, icon:DEFAULT_PIN_ICON };
      pinEditorEl.innerHTML = `
        <form class="pin-form" id="pinForm">
          <label for="pinLabel">Label</label>
          <input type="text" id="pinLabel" maxlength="60" required value="${escapeHtml(pin.label)}" />
          <label for="pinUrl">URL</label>
          <!-- text, not url: type="url" rejects a bare "example.com" outright
               (so the https:// auto-prefix below never got a chance) while
               happily accepting "javascript:". safeUrl() does both jobs. -->
          <input type="text" inputmode="url" id="pinUrl" maxlength="2048" required
                 placeholder="example.com" value="${escapeHtml(pin.url)}" />
          <label>Icon</label>
          <div class="icon-picks" id="pinIcons">
            ${PIN_ICON_IDS.map(iconId => `<button type="button" class="icon-pick" data-icon="${iconId}" aria-pressed="${iconId === normalizePinIcon(pin.icon)}" aria-label="${PIN_ICON_LABELS[iconId] || iconId}">${pinIconSvg(iconId)}</button>`).join("")}
          </div>
          <label>Color</label>
          <div class="swatches" id="pinSwatches">
            ${PIN_COLORS.map(c => `<button type="button" class="swatch" style="background:${c}" data-color="${c}" aria-pressed="${c === pin.color}" aria-label="Color ${c}"></button>`).join("")}
          </div>
          <div class="form-actions">
            <button class="btn-sm btn-primary" type="submit">${id ? "Save" : "Add pin"}</button>
            <button class="btn-sm btn-ghost" type="button" id="pinCancel">Cancel</button>
            ${id ? '<button class="btn-sm btn-danger" type="button" id="pinDelete">Delete</button>' : ""}
          </div>
        </form>`;
      let chosenColor = pin.color;
      let chosenIcon = normalizePinIcon(pin.icon);
      pinEditorEl.querySelectorAll(".swatch").forEach(sw => {
        sw.addEventListener("click", () => {
          chosenColor = sw.dataset.color;
          pinEditorEl.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", s === sw ? "true" : "false"));
        });
      });
      pinEditorEl.querySelectorAll(".icon-pick").forEach(btn => {
        btn.addEventListener("click", () => {
          chosenIcon = btn.dataset.icon;
          pinEditorEl.querySelectorAll(".icon-pick").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
        });
      });
      document.getElementById("pinCancel").addEventListener("click", closePinForm);
      const delBtn = document.getElementById("pinDelete");
      if (delBtn) delBtn.addEventListener("click", () => {
        state.pins = state.pins.filter(p => p.id !== id);
        scheduleSave();
        closePinForm();
        renderPins();
      });
      document.getElementById("pinForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const label = document.getElementById("pinLabel").value.trim();
        const url = safeUrl(document.getElementById("pinUrl").value);
        if (!label || !url) return;
        if (id) {
          const p = state.pins.find(x => x.id === id);
          Object.assign(p, { label, url, color: chosenColor, icon: chosenIcon });
        } else {
          if (state.pins.length >= 40) return;
          state.pins.push({ id: uid(), label, url, color: chosenColor, icon: chosenIcon });
        }
        scheduleSave();
        closePinForm();
        renderPins();
      });
    }
    function closePinForm(){ editingPinId = null; pinEditorEl.innerHTML = ""; }

    pinManageBtn.addEventListener("click", () => {
      pinManaging = !pinManaging;
      pinManageBtn.setAttribute("aria-pressed", String(pinManaging));
      pinManageBtn.textContent = pinManaging ? "Done" : "Manage";
      if (!pinManaging) closePinForm();
      else openPinForm(null);
      renderPins();
    });

    // ---- todos ----
    const todosEl = document.getElementById("todos");
    const todoAddToggle = document.getElementById("todoAddToggle");
    const todoAddForm = document.getElementById("todoAdd");
    const todoInput = document.getElementById("todoInput");
    const todoAddCancel = document.getElementById("todoAddCancel");
    const todoFoot = document.getElementById("todoFoot");
    const clearDoneBtn = document.getElementById("clearDone");

    let todoArranging = false;

    /* Display order: unfinished items keep their custom order, finished ones
       sink to the bottom. Unchecking an item puts it back where it was. */
    function orderedTodos(){
      return state.todos.filter(t => !t.done).concat(state.todos.filter(t => t.done));
    }

    /* Swap with the neighbour above/below, but never across the
       unfinished/finished divide — the render would just undo that. */
    function moveTodo(id, dir){
      const ordered = orderedTodos();
      const i = ordered.findIndex(t => t.id === id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= ordered.length) return;
      if (ordered[j].done !== ordered[i].done) return;
      [ordered[i], ordered[j]] = [ordered[j], ordered[i]];
      state.todos = ordered;
      scheduleSave();
      renderTodos();
    }

    function renderTodos(){
      todosEl.classList.toggle("is-arranging", todoArranging);
      if (!state.todos.length) {
        todosEl.innerHTML = `<li class="list-empty">Clear deck — nothing on the list yet.</li>`;
        todoFoot.hidden = true;
        applySearch();
        return;
      }
      const ordered = orderedTodos();
      todosEl.innerHTML = ordered.map((t, i) => {
        const canUp = i > 0 && ordered[i - 1].done === t.done;
        const canDown = i < ordered.length - 1 && ordered[i + 1].done === t.done;
        const moves = todoArranging ? `
            <button class="todo-move" type="button" aria-label="Move up" data-up="${t.id}"${canUp ? "" : " disabled"}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
            </button>
            <button class="todo-move" type="button" aria-label="Move down" data-down="${t.id}"${canDown ? "" : " disabled"}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>` : "";
        return `
        <li class="todo${t.done ? " done" : ""}" data-id="${t.id}" data-search="${escapeHtml(t.text)}">
          <button class="todo-check" type="button" aria-label="${t.done ? "Mark not done" : "Mark done"}" data-check="${t.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
          <span class="todo-text" data-text="${t.id}">${escapeHtml(t.text)}</span>
          <span class="todo-actions">${moves}
            <button class="todo-del" type="button" aria-label="Delete" data-del="${t.id}">✕</button>
          </span>
        </li>`;
      }).join("");
      todoFoot.hidden = !state.todos.some(t => t.done);
      todosEl.querySelectorAll("[data-up]").forEach(btn => {
        btn.addEventListener("click", () => moveTodo(btn.dataset.up, -1));
      });
      todosEl.querySelectorAll("[data-down]").forEach(btn => {
        btn.addEventListener("click", () => moveTodo(btn.dataset.down, 1));
      });
      todosEl.querySelectorAll("[data-check]").forEach(btn => {
        btn.addEventListener("click", () => {
          const t = state.todos.find(x => x.id === btn.dataset.check);
          t.done = !t.done;
          scheduleSave();
          renderTodos();
        });
      });
      todosEl.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.todos = state.todos.filter(x => x.id !== btn.dataset.del);
          scheduleSave();
          renderTodos();
        });
      });
      todosEl.querySelectorAll("[data-text]").forEach(span => {
        span.addEventListener("click", () => {
          const id = span.dataset.text;
          const t = state.todos.find(x => x.id === id);
          const input = document.createElement("input");
          input.type = "text";
          input.className = "todo-edit";
          input.value = t.text;
          input.maxLength = 300;
          span.replaceWith(input);
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
          const commit = () => {
            const v = input.value.trim();
            if (v) t.text = v;
            scheduleSave();
            renderTodos();
          };
          input.addEventListener("blur", commit);
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); input.blur(); }
            if (e.key === "Escape") { renderTodos(); }
          });
        });
      });
      applySearch();
    }

    function setTodoAddOpen(open){
      todoAddForm.hidden = !open;
      todoAddToggle.setAttribute("aria-expanded", String(open));
      todoAddToggle.textContent = open ? "Done" : "Add";
      todoArranging = open;
      renderTodos();
    }

    todoAddToggle.addEventListener("click", () => {
      const open = todoAddForm.hidden;
      setTodoAddOpen(open);
      if (open) todoInput.focus();
    });
    todoAddCancel.addEventListener("click", () => {
      setTodoAddOpen(false);
      todoInput.value = "";
    });
    todoAddForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;
      if (state.todos.length >= 300) return;
      state.todos.push({ id: uid(), text, done:false, created: new Date().toISOString() });
      todoInput.value = "";
      scheduleSave();
      renderTodos();
    });
    clearDoneBtn.addEventListener("click", () => {
      state.todos = state.todos.filter(t => !t.done);
      scheduleSave();
      renderTodos();
    });

    /* ---- week strip + day notes ----------------------------------------
       Local-midnight dates throughout: building these from UTC would slide
       the highlighted day by one either side of the date line. */
    const weekEl = document.getElementById("calWeek");
    const dateEl = document.getElementById("calDate");
    const todayBtn = document.getElementById("calToday");
    const calAddForm = document.getElementById("calAddForm");
    const calInput = document.getElementById("calInput");
    const calAddToggle = document.getElementById("calAddToggle");
    const calAddCancel = document.getElementById("calAddCancel");
    const MAX_CAL_EVENTS = 200;

    const midnight = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const addDays = (d, n) => { const x = midnight(d); x.setDate(x.getDate() + n); return x; };
    const weekOf = (d) => addDays(d, -midnight(d).getDay());
    const sameDay = (a, b) => midnight(a).getTime() === midnight(b).getTime();
    const longDate = (d) => d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });

    let calSelected = midnight(new Date());

    function eventsForDate(d){
      const key = dateKey(d);
      return state.events.filter(e => e.date === key);
    }

    function setCalAddOpen(open){
      calAddForm.hidden = !open;
      calAddToggle.hidden = open;
      if (open) calInput.focus();
      else calInput.value = "";
    }

    function calPillHtml(e){
      return `<span class="cal-pill" data-search="${escapeHtml(e.text)}">
          <span class="cal-pill-text">${escapeHtml(e.text)}</span>
          <button class="cal-pill-del" type="button" aria-label="Remove ${escapeHtml(e.text)}" data-cal-del="${e.id}">×</button>
        </span>`;
    }

    function wireCalPillDeletes(root){
      root.querySelectorAll("[data-cal-del]").forEach(btn => {
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          state.events = state.events.filter(e => e.id !== btn.dataset.calDel);
          scheduleSave();
          renderCal();
        });
      });
    }

    function renderCal(){
      const today = midnight(new Date());
      const start = weekOf(calSelected);
      dateEl.textContent = longDate(calSelected);
      weekEl.innerHTML = "";
      for (let i = 0; i < 7; i++){
        const d = addDays(start, i);
        const isToday = sameDay(d, today);
        const items = eventsForDate(d);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cal-day" + (isToday ? " is-today" : "");
        btn.setAttribute("aria-pressed", String(sameDay(d, calSelected)));
        btn.setAttribute("aria-label", isToday ? `${longDate(d)} (today)` : longDate(d));
        btn.innerHTML =
          `<span class="cal-dow" aria-hidden="true">${d.toLocaleDateString(undefined, { weekday:"short" })}</span>` +
          `<span class="cal-num" aria-hidden="true">${d.getDate()}</span>`;
        btn.addEventListener("click", () => {
          calSelected = d;
          setCalAddOpen(false);
          renderCal();
        });
        const li = document.createElement("li");
        li.className = "cal-cell";
        li.appendChild(btn);
        if (items.length) {
          const notes = document.createElement("div");
          notes.className = "cal-day-notes";
          notes.innerHTML = items.map(calPillHtml).join("");
          li.appendChild(notes);
        }
        weekEl.appendChild(li);
      }
      wireCalPillDeletes(weekEl);
      todayBtn.hidden = sameDay(start, weekOf(today));
      applySearch();
    }

    document.getElementById("calPrev").addEventListener("click", () => {
      calSelected = addDays(calSelected, -7);
      setCalAddOpen(false);
      renderCal();
    });
    document.getElementById("calNext").addEventListener("click", () => {
      calSelected = addDays(calSelected, 7);
      setCalAddOpen(false);
      renderCal();
    });
    todayBtn.addEventListener("click", () => {
      calSelected = midnight(new Date());
      setCalAddOpen(false);
      renderCal();
    });
    calAddToggle.addEventListener("click", () => setCalAddOpen(true));
    calAddCancel.addEventListener("click", () => setCalAddOpen(false));
    calAddForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = calInput.value.trim();
      if (!text || state.events.length >= MAX_CAL_EVENTS) return;
      state.events.push({ id: uid(), date: dateKey(calSelected), text });
      scheduleSave();
      setCalAddOpen(false);
      renderCal();
    });

    loadLocal();
    renderPins();
    renderTodos();
    renderCal();
    loadRemote();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
